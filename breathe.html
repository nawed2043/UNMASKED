<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>UNMASKED // Bat-Pulse</title>
    <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@700&family=Roboto:wght@400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <style>
        /* Shared Tactical Layout */
    body {
        /* FIXED: Reduced opacity from 0.65/0.75 to 0.3/0.5 for a much clearer view */
        background: linear-gradient(rgba(13, 17, 23, 0.3), rgba(13, 17, 23, 0.5)), 
                    url('GOTHAM.jpg');
        background-size: cover;
        background-position: center;
        background-attachment: fixed;
        margin: 0;
        overflow-x: hidden;
        color: white;
    }

    /* FIXED: Reduced scanline opacity to 0.05 to ensure the image looks high-definition */
    body::before {
        content: "";
        position: fixed;
        top: 0; left: 0; width: 100%; height: 100%;
        background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.1) 50%), 
                    linear-gradient(90deg, rgba(255, 255, 255, 0.02), rgba(0, 0, 0, 0.02));
        background-size: 100% 4px, 3px 100%;
        z-index: 1000;
        pointer-events: none;
        opacity: 0.05; 
    }

    .gcpd-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 15px 5%;
        background: rgba(5, 7, 10, 0.95); /* Added slight transparency to header */
        border-bottom: 2px solid #ffc107;
        position: sticky;
        top: 0;
        z-index: 100;
    }

    /* Keep the tactic-card dark and solid so the text remains sharp and readable */
    .tactic-card, .district-box {
        background: rgba(10, 10, 10, 0.9); 
        border: 1px solid #444;
        box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }


        .logo-box {
            border: 2px solid #ffc107;
            padding: 5px 15px;
            color: #ffc107;
            font-family: 'Oswald', sans-serif;
            letter-spacing: 2px;
        }

        .nav-links a {
            text-decoration: none;
            color: #fff;
            font-family: 'Oswald', sans-serif;
            margin-left: 20px;
            transition: 0.3s;
            font-size: 0.9rem;
        }

        .nav-links a:hover, .nav-links a.active { 
            color: #ffc107; 
            text-shadow: 0 0 10px #ffc107; 
        }

        /* Breathing Tool Specifics */
        .centered-tool {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 70vh;
            text-align: center;
        }

        .breathe-circle-wrap {
            position: relative;
            height: 350px;
            width: 350px;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 1px dashed rgba(255, 193, 7, 0.2);
        }

        #breathe-square {
            width: 100px;
            height: 100px;
            border: 4px solid #ffc107;
            background: rgba(255, 193, 7, 0.1);
            transition: all 4000ms linear; /* Perfectly synced with the 4s JS interval */
            box-shadow: 0 0 20px rgba(255, 193, 7, 0.2);
        }

        .status-indicator {
            margin-top: 3rem;
            color: #ffc107;
            font-family: 'Oswald';
            font-size: 1.5rem;
            letter-spacing: 2px;
            text-shadow: 0 0 10px rgba(255, 193, 7, 0.5);
        }

        .btn-gold {
            background: #ffc107;
            color: #000;
            border: none;
            padding: 1rem 2.5rem;
            font-family: 'Oswald';
            font-weight: bold;
            cursor: pointer;
            text-transform: uppercase;
            transition: 0.3s;
            margin-top: 2rem;
        }

        .btn-gold:hover {
            background: #fff;
            box-shadow: 0 0 20px #fff;
        }
    </style>
</head>
<body>

    <!-- ADDED GCPD NAVIGATION -->
    <header class="gcpd-header">
        <div class="logo-box">UNMASKED</div>
        <nav class="nav-links">
            <span id="agent-display" style="color: #ffc107; font-family: monospace; font-size: 0.8rem; margin-right: 10px;"></span>
            <a href="map.html">RETURN_TO_MAP</a>
            <a href="checker.html">CLUE SCANNER</a>
            <a href="breathe.html" class="active">BAT-PULSE</a>
            <a href="audio.html">SONIC SIGNALS</a>
        </nav>
    </header>

    <div class="skyline-filter"></div>
    
    <div class="content-wrapper centered-tool">
        <h2 style="font-family: 'Oswald'; margin-bottom: 2rem; letter-spacing: 3px;">
            STABILIZE <span style="color: #ffc107;">RESPIRATORY ARMOR</span>
        </h2>
        
        <div class="breathe-circle-wrap">
            <div id="breathe-square"></div>
        </div>

        <!-- Playful Status Area -->
        <div class="status-indicator" id="status-text">WAITING FOR COMMAND...</div>
        
        <button class="btn-gold" id="action-btn" onclick="startBreathe()">ENGAGE TRAINING</button>
        
        <p style="margin-top: 2rem; color: #5c6b73; font-family: monospace; font-size: 0.8rem; max-width: 400px;">
            "Mind and body are one. Breathe like the shadows." — Alfred
        </p>
    </div>

    <script>
        // Set Agent ID from LocalStorage
        const agentName = localStorage.getItem('agentName') || "ROBIN";
        document.getElementById('agent-display').innerText = "AGENT: " + agentName.toUpperCase();

        // Batman Movie-Inspired Breathing Text
        const stages = [
            { text: "EXPAND THE CAPE (INHALE)", size: "300px" },
            { text: "BE THE SILENCE (HOLD)", size: "300px" },
            { text: "RELEASE THE FEAR (EXHALE)", size: "100px" },
            { text: "WATCH GOTHAM (HOLD)", size: "100px" }
        ];

        let i = 0;
        let breathingActive = false;

        function startBreathe() {
            if (breathingActive) return;
            breathingActive = true;
            
            // Hide the button so the user focuses on breathing
            document.getElementById('action-btn').style.opacity = "0.3";
            document.getElementById('action-btn').innerText = "CALIBRATING...";

            // Initial call
            const updateCycle = () => {
                const stage = stages[i % 4];
                document.getElementById('status-text').innerText = stage.text;
                document.getElementById('breathe-square').style.width = stage.size;
                document.getElementById('breathe-square').style.height = stage.size;
                i++;
            };

            updateCycle();
            setInterval(updateCycle, 4000); // 4-second box breathing cycle
        }
    </script>
</body>
</html>
