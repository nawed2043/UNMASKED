<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>UNMASKED // Clue Scanner</title>
    <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@700&family=Roboto:wght@400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <style>
        /* Shared Tactical Layout */
    body {
        /* FIXED: Reduced opacity from 0.65/0.75 to 0.3/0.5 for a much clearer view */
        background: linear-gradient(rgba(13, 17, 23, 0.3), rgba(13, 17, 23, 0.5)), 
                    url('GOTHAM.jpg');
        background-size: cover;
        background-position: center;
        background-attachment: fixed;
        margin: 0;
        overflow-x: hidden;
        color: white;
    }

    /* FIXED: Reduced scanline opacity to 0.05 to ensure the image looks high-definition */
    body::before {
        content: "";
        position: fixed;
        top: 0; left: 0; width: 100%; height: 100%;
        background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.1) 50%), 
                    linear-gradient(90deg, rgba(255, 255, 255, 0.02), rgba(0, 0, 0, 0.02));
        background-size: 100% 4px, 3px 100%;
        z-index: 1000;
        pointer-events: none;
        opacity: 0.05; 
    }

    .gcpd-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 15px 5%;
        background: rgba(5, 7, 10, 0.95); /* Added slight transparency to header */
        border-bottom: 2px solid #ffc107;
        position: sticky;
        top: 0;
        z-index: 100;
    }

    /* Keep the tactic-card dark and solid so the text remains sharp and readable */
    .tactic-card, .district-box {
        background: rgba(10, 10, 10, 0.9); 
        border: 1px solid #444;
        box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }


        .logo-box {
            border: 2px solid #ffc107;
            padding: 5px 15px;
            color: #ffc107;
            font-family: 'Oswald', sans-serif;
            letter-spacing: 2px;
        }

        .nav-links a {
            text-decoration: none;
            color: #fff;
            font-family: 'Oswald', sans-serif;
            margin-left: 20px;
            transition: 0.3s;
            font-size: 0.9rem;
        }

        .nav-links a:hover, .nav-links a.active { 
            color: #ffc107; 
            text-shadow: 0 0 10px #ffc107; 
        }

        .tactic-card {
            background: rgba(10, 10, 10, 0.95);
            border: 2px solid #444;
            padding: 2.5rem;
            max-width: 600px;
            margin: 5rem auto;
            border-left: 5px solid #ffc107;
        }

        .btn-gold {
            background: #ffc107;
            color: #000;
            border: none;
            padding: 1rem;
            font-family: 'Oswald';
            font-weight: bold;
            cursor: pointer;
            text-transform: uppercase;
            transition: 0.2s;
            text-align: left;
        }

        .btn-gold:hover {
            background: #fff;
            box-shadow: 0 0 15px #fff;
            transform: translateX(5px);
        }
    </style>
</head>
<body>

    <!-- GCPD NAVIGATION -->
    <header class="gcpd-header">
        <div class="logo-box">UNMASKED</div>
        <nav class="nav-links">
            <span id="agent-display" style="color: #ffc107; font-family: monospace; font-size: 0.8rem; margin-right: 10px;"></span>
            <a href="map.html">RETURN_TO_MAP</a>
            <a href="checker.html" class="active">CLUE SCANNER</a>
            <a href="breathe.html">BAT-PULSE</a>
            <a href="audio.html">SONIC SIGNALS</a>
        </nav>
    </header>

    <div class="skyline-filter"></div>

    <div class="content-wrapper">
        <div class="tactic-card" id="checker-box">
            <h2 id="q-title" style="color: #ffc107; letter-spacing: 2px;">CASE_FILE_01</h2>
            
            <p id="q-text" style="font-size:1.3rem; margin:1rem 0; font-family: 'Roboto'; line-height: 1.4;">
                Is Scarecrow's fear toxin making you feel jumpy or on edge lately?
            </p>
            
            <div style="display:grid; gap:12px;">
                <button class="btn-gold" onclick="record(0)">● SYSTEMS CLEAR</button>
                <button class="btn-gold" onclick="record(1)">● MINOR INTERFERENCE</button>
                <button class="btn-gold" onclick="record(2)">● PERSISTENT STATIC</button>
                <button class="btn-gold" onclick="record(3)">● TOTAL SIGNAL JAM</button>
            </div>
        </div>
    </div>

    <script>
        // Set Agent ID
        const agentName = localStorage.getItem('agentName') || "ROBIN";
        document.getElementById('agent-display').innerText = "AGENT: " + agentName.toUpperCase();

        const questions = [
            "Is Scarecrow's fear toxin making you feel jumpy or on edge lately?",
            "Having trouble stopping the Riddler's puzzles from looping in your head?",
            "Losing your taste for the nightlife? Bat-signal just doesn't excite you?",
            "Does the weight of Gotham feel like it's crushing your spirit today?",
            "Trouble staying in the shadows? Are you failing to get your Bat-nap?"
        ];

        let current = 0;
        let score = 0;

        function record(val) {
            score += val;
            current++;
            if(current < questions.length) {
                document.getElementById('q-title').innerText = `CASE_FILE_0${current + 1}`;
                document.getElementById('q-text').innerText = questions[current];
            } else {
                showResults();
            }
        }

        function showResults() {
            const box = document.getElementById('checker-box');
            let district, url, message, statusLabel;

            // Updated Score Logic
            if (score <= 3) {
                statusLabel = "SYSTEMS OPTIMAL";
                message = "The Batmobile is fueled and ready, sir. Gotham is quiet for now. Perhaps some ambient frequencies to keep your focus sharp?";
                district = "SONIC SIGNALS";
                url = "audio.html";
            } else if (score <= 6) {
                statusLabel = "MODERATE FATIGUE";
                message = "Alfred has analyzed the evidence. He suggests we glide over to this sector to thaw out the mission fatigue:";
                district = "DEPRESSION_HEIGHTS";
                url = "depression.html";
            } else {
                statusLabel = "THREAT DETECTED";
                message = "The fear toxin is hitting hard, sir. We need to neutralize the threat matrix in this district immediately:";
                district = "ANXIETY_DISTRICT";
                url = "anxiety.html";
            }
            
            box.innerHTML = `
                <h2 style="color: #ffc107; letter-spacing: 2px;">THE DETECTIVE'S VERDICT</h2>
                <p style="font-family: monospace; color: #8a9ba3; margin-bottom: 1rem;">COWL_SCORE: ${score} // STATUS: ${statusLabel}</p>
                <p style="font-size: 1.2rem; margin: 1.5rem 0; line-height: 1.5;">
                    ${message}
                </p>
                <a href="${url}" class="btn-gold" style="display: block; text-align: center; text-decoration: none;">PROCEED TO ${district}</a>
                <a href="index.html" style="display: block; text-align: center; color: #5c6b73; margin-top: 1.5rem; text-decoration: none; font-family: 'Oswald'; font-size: 0.8rem;">RETURN TO BAT-TERMINAL</a>
            `;
        }
    </script>
</body>
</html>
